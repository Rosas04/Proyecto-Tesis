services:
  # 1. Backend (FastAPI + Playwright usando Docker)
  - type: web
    name: frontmind-backend
    runtime: docker
    dockerfilePath: frontmind-agents/Dockerfile
    dockerContext: frontmind-agents
    plan: free # El plan free sí es válido para Web Services en Docker
    healthCheckPath: /
    envVars:
      # Valores secretos: definirlos en el dashboard de Render (sync: false)
      - key: BACKEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ABSTRACT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: FRONTMIND_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"

  # 2. Frontend (Vite + React como Sitio Estático)
  - type: web
    name: frontmind-frontend
    runtime: static
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # NO ponemos 'plan: free' aquí, ya que los sitios estáticos son gratis por defecto en Render
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: frontmind-backend
          property: url
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Debe coincidir con BACKEND_API_KEY del backend
      - key: VITE_BACKEND_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
